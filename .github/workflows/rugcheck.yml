name: Update RugCheck data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch RugCheck report
        run: python scripts/fetch_rugcheck.py

      - name: Commit if changed
        run: |
          git config user.name "goblife1031"
          git config user.email "goblife1031@gmail.com"
          if git diff --quiet -- data/rugcheck.json; then
            echo "No change, skipping commit."
          else
            git add data/rugcheck.json
            git commit -m "Update RugCheck data [automated]"
            git push
          fi
